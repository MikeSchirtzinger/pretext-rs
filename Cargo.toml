[package]
name = "pretext"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "DOM-free text measurement and line-breaking engine. Rust port of @chenglou/pretext."
license = "MIT"
readme = "README.md"
repository = "https://github.com/MikeSchirtzinger/pretext-rs"
keywords = ["text", "layout", "line-breaking", "wasm", "webgpu"]
categories = ["text-processing", "wasm", "rendering"]
exclude = [
    ".github/",
    "demo.html",
    "demo.svg",
    "deny.toml",
    "package.json",
    "package-lock.json",
    "rust-toolchain.toml",
    "rustfmt.toml",
]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:serde_json"]
skrifa-nominal = ["dep:skrifa"]

[dependencies]
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-segmentation = "1.12"

# WASM backend (optional)
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "TextMetrics",
    "Document",
    "Window",
], optional = true }
js-sys = { version = "0.3", optional = true }

# JSON parsing for WASM batch API
serde_json = { version = "1.0", optional = true }

# Explicit native nominal-advance estimator (optional). This is not a shaping
# backend, so leave Skrifa's shaping-oriented default feature disabled.
skrifa = { version = "0.44", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
approx = "0.5"
font-test-data = "0.7"
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "demo_svg"
path = "examples/demo_svg.rs"
